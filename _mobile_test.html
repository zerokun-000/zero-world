<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>流程测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#000;color:#ddd;min-height:100vh;display:flex;align-items:center;justify-content:center}

#gate{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#gate input{background:#111;border:1px solid #333;color:#d4a843;padding:12px 20px;font-size:16px;text-align:center;width:240px;margin-bottom:12px}
#gate button{background:#333;border:1px solid #555;color:#d4a843;padding:10px 30px;font-size:14px}

#unlock-anim{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);opacity:0;pointer-events:none;transition:opacity .4s}
#unlock-anim.show{opacity:1;pointer-events:auto}
.ua-box{text-align:center;font-size:20px;color:#d4a843}

#egg-name-modal{position:fixed;inset:0;z-index:10001;display:none;background:rgba(5,3,2,.97);flex-direction:column;align-items:center;justify-content:center;padding:20px}
#egg-name-modal.show{display:flex;animation:fIn .4s}
@keyframes fIn{from{opacity:0}to{opacity:1}}
.enm-icon{font-size:36px;color:#d4a843;margin-bottom:16px}
.enm-label{font-size:13px;color:#8b7355;letter-spacing:3px}
.enm-code{font-size:11px;color:#5a4a2a;letter-spacing:4px;margin-bottom:24px}
.enm-input{background:rgba(20,16,10,.9);border:1px solid #8b6914;color:#d4a843;padding:12px 16px;font-size:16px;width:240px;text-align:center}
.enm-submit{margin-top:16px;background:rgba(139,105,20,.3);border:1px solid #8b6914;color:#d4a843;padding:10px 40px;font-size:14px}
.enm-skip{margin-top:12px;font-size:11px;color:#3a2a1a;opacity:.5}

#result{font-size:14px;color:#888;text-align:center;padding:40px}
</style></head>

<body>
<div id="gate">
  <input id="pw" placeholder="输入密码" />
  <button onclick="testPw()">确认</button>
  <div style="color:red;font-size:12px;margin-top:8px">密码：zerotime</div>
</div>

<div id="unlock-anim">
  <div class="ua-box">🔓 授权成功，允许访问<br><small>ACCESS GRANTED</small></div>
</div>

<div id="egg-name-modal">
  <div class="enm-icon">🌀</div>
  <div class="enm-label">TEMPORAL ADMINISTRATION BUREAU</div>
  <div class="enm-code">请您输入授权代号</div>
  <input class="enm-input" placeholder="输入您的代号" />
  <button class="enm-submit" onclick="closeEgg()">确认</button>
  <div class="enm-skip" onclick="closeEgg()">跳过 · 匿名访问</div>
</div>

<div id="result">
  <p>测试页面 — 检查手机端流程是否正常</p>
  <p>输入 <b>zerotime</b> 测试完整流程</p>
  <p id="log"></p>
</div>

<script>
function testPw(){
  var pw = document.getElementById('pw').value.trim();
  if(pw !== 'zerotime'){
    document.getElementById('log').innerHTML = '<span style="color:red">密码错误</span>';
    return;
  }
  document.getElementById('log').innerHTML = '✅ 密码正确，开始流程...<br>';

  // Step 1: 隐藏 gate
  document.getElementById('gate').style.display = 'none';
  log('Step 1: gate 已隐藏');

  // Step 2: 显示解锁动画
  showUnlockAnim(function(){
    log('Step 3: 解锁动画结束，调用 eggWelcome');
    eggWelcome();
  });
}

function showUnlockAnim(callback){
  var anim = document.getElementById('unlock-anim');
  if(anim){
    var start = Date.now();
    anim.classList.add('show');
    log('Step 2: unlock-anim 已添加 .show 类 (t=' + (Date.now()-start) + 'ms)');
  }
  setTimeout(function(){
    if(anim){
      anim.classList.remove('show');
      log('Step 2.5: unlock-anim 已移除 .show 类 (t=' + (Date.now()-start) + 'ms)');
    }
    if(callback) callback();
  }, 800);
}

function eggWelcome(){
  var modal = document.getElementById('egg-name-modal');
  log('Step 4: eggWelcome 开始，modal 元素存在:' + !!modal);
  if(!modal){ log('❌ modal 不存在！'); return; }

  modal.classList.add('show');
  log('Step 5: modal 已添加 .show，当前 display=' + getComputedStyle(modal).display);

  // 强制显示兜底
  modal.style.display = 'flex';
  modal.offsetHeight;
  log('Step 6: 强制 display=flex，当前 visibility 状态检查...');
}

function closeEgg(){
  document.getElementById('egg-name-modal').style.display = 'none';
  document.getElementById('log').innerHTML += '<br>✅ 取名框已关闭，流程完成！';
}

function log(msg){
  document.getElementById('log').innerHTML += msg + '<br>';
  console.log(msg);
}
</script></body></html>
